# Integração contínua. Observação: este workflow foi escrito e validado só quanto à sintaxe (YAML) neste repositório;
# ele ainda não foi executado no GitHub Actions. Em produção, fixe as actions por SHA de commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + testes de integração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      # Os testes de integração usam Testcontainers (PostgreSQL real): o runner já tem Docker.
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: backend-test-reports
          path: backend/target/failsafe-reports

  agent:
    name: Agente local (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - run: mvn -B -f agent/pom.xml verify
      - name: Launcher do agente (rollback de atualização)
        run: scripts/test-agent-launcher.sh

  web:
    name: Painel e app do morador (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Falha só para vulnerabilidades altas/críticas que entram no código publicado (dependências de produção).
      - run: npm audit --omit=dev --audit-level=high

  compose-config:
    name: Valida os arquivos do Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Desenvolvimento
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q
          docker compose -f docker-compose.keycloak-dev.yml config -q
      - name: Produção (valores fictícios só para a validação sintática)
        run: |
          DB_PASSWORD=x DOMAIN=example.test KEYCLOAK_ADMIN=a KEYCLOAK_ADMIN_PASSWORD=x \
          CREDENTIAL_HMAC_SECRET=x AGENT_POLICY_MASTER_SECRET=x GRAFANA_PASSWORD=x \
          FIELD_ENCRYPTION_KEYS=k1:x BLIND_INDEX_KEY=x \
          docker compose -f deploy/docker-compose.prod.yml config -q

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        run: mvn -B -f backend/pom.xml -DskipTests package
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  security:
    name: Dependências e segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      # O resolvedor de POM do OSV não conhece versões recém-publicadas (falha silenciosa no backend).
      # O SBOM CycloneDX gerado pelo Maven traz as versões já resolvidas de verdade.
      - name: SBOM das dependências Java
        run: |
          for m in backend agent; do
            mvn -B -q -f $m/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom \
              -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false
          done
      - name: Vulnerabilidades em dependências (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=web/package-lock.json
            --sbom=backend/target/bom.json
            --sbom=agent/target/bom.json
      - name: Segredos versionados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

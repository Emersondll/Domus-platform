# Produção. Diferenças em relação ao desenvolvimento: sem valores padrão para segredos/banco (a aplicação falha ao
# iniciar se faltarem), logs estruturados em JSON, documentação interativa da API desligada e proxy confiável.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri valida o claim "iss"; jwk-set-uri evita a descoberta pela URL pública (rede interna do compose).
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
          # O token precisa ter sido emitido PARA esta API (mapper de audiência no Keycloak); evita aceitar token de outro cliente.
          audiences: ${OIDC_AUDIENCE:portaria-api}

server:
  forward-headers-strategy: native
  shutdown: graceful

logging:
  structured:
    format:
      console: logstash

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

portaria:
  rate-limit:
    # Atrás do Caddy, que sobrescreve X-Forwarded-For com o IP real do cliente.
    trust-forwarded-for: true
  devices:
    simulator-enabled: false

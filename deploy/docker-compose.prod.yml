# Produção (ou homologação). Configuração independente da de desenvolvimento.
# Uso (da raiz do repositório):
#   mvn -f backend/pom.xml package -DskipTests && npm --prefix web run build
#   cp deploy/.env.prod.example deploy/.env.prod   # preencha TODOS os segredos
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
name: portaria-prod

services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: portaria
      POSTGRES_USER: portaria
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portaria -d portaria"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: portaria
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN:?defina DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?defina KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/portaria-realm.json:/opt/keycloak/data/import/portaria-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      db:
        condition: service_healthy
    # Só rede interna: o Keycloak não precisa de saída (sem e-mail, sem login social) e o proxy o alcança por dentro.
    networks: [internal]

  app:
    build:
      context: ../backend
    image: portaria-platform:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/portaria
      DB_USER: portaria
      DB_PASSWORD: ${DB_PASSWORD}
      OIDC_ISSUER_URI: https://auth.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}/realms/portaria
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/portaria/protocol/openid-connect/certs
      CREDENTIAL_HMAC_SECRET: ${CREDENTIAL_HMAC_SECRET:?defina CREDENTIAL_HMAC_SECRET}
      AGENT_POLICY_MASTER_SECRET: ${AGENT_POLICY_MASTER_SECRET:?defina AGENT_POLICY_MASTER_SECRET}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?defina FIELD_ENCRYPTION_KEYS}
      FIELD_ENCRYPTION_ACTIVE_KEY_ID: ${FIELD_ENCRYPTION_ACTIVE_KEY_ID:-}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?defina BLIND_INDEX_KEY}
      FIELD_ENCRYPTION_MIGRATE: ${FIELD_ENCRYPTION_MIGRATE:-false}
      DEVICE_HTTP_ALLOWED_HOSTS: ${DEVICE_HTTP_ALLOWED_HOSTS:-}
      BOOTSTRAP_PLATFORM_ADMIN_SUBJECT: ${BOOTSTRAP_PLATFORM_ADMIN_SUBJECT:-}
      BOOTSTRAP_PLATFORM_ADMIN_EMAIL: ${BOOTSTRAP_PLATFORM_ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    # Só rede interna: sem saída para a internet nem para a rede do servidor. Se a central precisar falar com controladoras ou com
    # o servidor de mídia, some o override docker-compose.prod.devices.yml (e restrinja o destino no firewall: docs/operations.md).
    networks: [internal]
    healthcheck:
      # JRE sem curl: requisição HTTP mínima pela porta de gestão (interna)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  proxy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      PUBLIC_PORT_SUFFIX: ${PUBLIC_PORT_SUFFIX:-}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/panel/dist:/srv/panel:ro
      - ../web/resident/dist:/srv/resident:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, keycloak]
    # Única porta de entrada e única com saída (precisa dela para o certificado); alcança app e keycloak pela rede interna.
    networks: [edge, internal]

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    # Rede interna para raspar a API; `host` só para publicar a porta (o Docker não publica porta de rede interna).
    networks: [internal, host]

  grafana:
    image: grafana/grafana:13.3.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Sem telemetria nem consulta de versão: o Grafana fica numa rede com saída só para poder publicar a porta no servidor.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal, host]

networks:
  # Sem saída: banco, Keycloak, API e (por dentro) o proxy.
  internal:
    internal: true
  # Porta de entrada pública e saída para o certificado (somente o proxy).
  edge:
  # Só para publicar as portas de observabilidade em 127.0.0.1 (profile `observability`).
  host:

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# Perfil de desenvolvimento local. Nunca usar em produção: emite tokens sem autenticação real.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
portaria:
  dev:
    seed-enabled: true
  credentials:
    hmac-secret: dev-only-secret-do-not-use-in-production-0123456789
  crypto:
    # SOMENTE desenvolvimento: chaves públicas no repositório, não protegem nada.
    keys: dev1:ZGV2LW9ubHktZmllbGQta2V5LTAxMjM0NTY3ODktYWI=
    blind-index-key: dev-only-blind-index-key-do-not-use-in-production-01
    migrate-on-start: true
  devices:
    simulator-enabled: true
    http-allowed-hosts: localhost,127.0.0.1
  agent:
    policy-master-secret: dev-only-agent-master-secret-do-not-use-in-production-01
  media:
    # SOMENTE desenvolvimento: vídeo ao vivo ligado, com segredos públicos. Precisa do MediaMTX (deploy/media).
    enabled: true
    token-secret: dev-only-media-token-secret-do-not-use-in-production-01
    publish-secret: dev-only-media-publish-secret
  snapshots:
    # SOMENTE desenvolvimento: captura ligada (câmeras SIMULATOR geram imagem sintética).
    enabled: true

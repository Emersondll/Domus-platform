global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: portaria
    metrics_path: /actuator/prometheus
    static_configs:
      # Desenvolvimento: API rodando no host (porta de gestão 8082). Em produção: app:8082 (ver deploy/prometheus/prometheus.prod.yml).
      - targets: ["host.docker.internal:8082"]
